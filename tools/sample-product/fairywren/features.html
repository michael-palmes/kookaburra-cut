    <script type="module">
      import { fillIcons, icon } from "../shared/icons.js";
      import { caretOn, ease, lerp, mix, params, press, ready, rise, seg, typed } from "../shared/motion.js";
      import { phoneChrome } from "../shared/phone.js";
      import { DAYS, dock, head, block as part, TICK, week } from "./parts.js";

      const P = params();
      const scene = P.scene ?? "sorted";
      const phone = document.getElementById("phone");
      const dark = P.mode === "dark";
      if (dark) phone.classList.add("dark");
      const $ = (id) => document.getElementById(id);
      const ARROW = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h11M9 4l4 4-4 4"/></svg>`;
      const block = (cls, time, title, meta, id = "") => part({ cls, time, title, meta, id });
      const pop = (el, t, at, dur = 380) => {
        const k = ease.outBack(seg(t, at, dur));
        el.style.opacity = String(Math.min(1, seg(t, at, dur) * 2));
        el.style.transform = `scale(${0.6 + 0.4 * k})`;
      };
      const tick = (el, t, at) => {
        const on = t >= at;
        el.classList.toggle("on", on);
        el.style.setProperty("--draw", String(on ? 22 * (1 - ease.out(seg(t, at + 60, 240))) : 22));
        el.style.transform = `scale(${on ? 1 + 0.15 * Math.sin(Math.PI * seg(t, at, 260)) : 1})`;
      };

      const LANES = [
        ["Mon", 11, [["sky", 0, 0.18, "Sync"], ["peach", 0.24, 0.48, "Interviews"], ["mint", 0.56, 0.88, "Focus"]]],
        ["Tue", 12, [["sky", 0, 0.14, "Plan"], ["lilac", 0.2, 0.42, "Review"], ["mint", 0.48, 0.74, "Focus"], ["butter", 0.8, 0.96, "Ship"]]],
        ["Wed", 13, [["peach", 0.06, 0.26, "1:1 Jo"], ["mint", 0.4, 0.72, "Focus"], ["sky", 0.78, 0.94, "Demo"]]],
        ["Thu", 14, [["mint", 0, 0.3, "Focus"], ["lilac", 0.36, 0.6, "Launch"], ["sky", 0.68, 0.84, "Sync"]]],
        ["Fri", 15, [["butter", 0.04, 0.22, "Retro"], ["mint", 0.28, 0.5, "Focus"]]],
      ];

      function sorted(t) {
        if (!phone.dataset.ready) {
          phone.innerHTML = `${head("11 to 17 May", "This week")}
            <div class="abs sorted" id="card"><div class="skeleton" id="skel"><div class="top"><span class="spark">${icon("sparkle")}</span><span class="title" style="color:#cfc8bd">Sorting your week</span></div><i style="width:70%;margin-top:22px"></i><i style="width:46%"></i><i style="width:58%"></i></div>
              <div id="done"><div class="top"><span class="spark">${icon("sparkle")}</span><span class="title">This week, sorted</span></div><div class="sub">Fairywren placed every plan around what matters.</div>
              <div class="stats"><div><b class="tnum" id="s1">12</b><span>plans placed</span></div><div><b class="tnum" id="s2">4</b><span>focus blocks</span></div><div><b>Fri</b><span>afternoon free</span></div></div>
              <div class="load">${[28, 34, 25, 32, 13].map((h, i) => `<i class="${i === 4 ? "free" : ""}" style="height:${h}px"></i>`).join("")}</div></div></div>
            <div class="label" style="top:368px"><span>Schedule</span><span class="count">Mon to Fri</span></div>
            <div class="abs rows">${LANES.map(([d, n, segs], r) => `<div class="drow"><div class="dl">${d}<b class="tnum">${n}</b></div><div class="lane">${segs.map(([c, a, b, txt]) => `<div class="seg ${c}" data-r="${r}" style="left:${a * 100}%;width:${(b - a) * 100}%">${txt}</div>`).join("")}${r === 4 ? `<div class="freechip" id="free">${icon("sun")}Afternoon free</div>` : ""}</div></div>`).join("")}</div>
            ${dock()}${phoneChrome()}`;
          fillIcons(phone);
          phone.dataset.ready = "1";
        }
        rise($("card"), t, 250, { dy: 22, dur: 620 });
        const swap = ease.inOut(seg(t, 1100, 300));
        $("skel").style.opacity = String(1 - swap);
        $("done").style.opacity = String(swap);
        const n = ease.out(seg(t, 1100, 900));
        $("s1").textContent = String(Math.round(lerp(0, 12, n)));
        $("s2").textContent = String(Math.round(lerp(0, 4, n)));
        for (const [i, el] of [...phone.querySelectorAll(".seg")].entries()) {
          const r = Number(el.dataset.r);
          const p = ease.outQuint(seg(t, 1350 + r * 260 + (i % 4) * 70, 520));
          el.style.opacity = String(Math.min(1, p * 1.5));
          el.style.transform = `translateX(${(1 - p) * 40}px)`;
        }
        pop($("free"), t, 3900);
      }

      function quickadd(t) {
        const TEXT = "Lunch with Jo Fri 12:30";
        if (!phone.dataset.ready) {
          phone.innerHTML = `${head("Tue 12 May", "Today")}${week()}
            <div class="abs quick" id="quick">${icon("sparkle")}<span id="typed"></span><span class="caret" id="caret"></span><span class="ph" id="ph">Add anything, in your words</span></div>
            <div class="abs card preview" id="preview"><div class="pv"><b>Lunch with Jo</b><div class="meta"><span>${icon("calendar")}Fri 15 May</span><span>${icon("clock")}12:30 to 13:30</span></div></div><div class="btn" id="addb">Add</div></div>
            <div class="label" id="label"><span>Schedule</span><span class="count">4 plans</span></div>
            <div class="blocks" id="blocks">${block("lilac", "10:30", "Design review", "Studio · 45 min")}${block("mint", "13:00", "Focus time", "Write the brief · 90 min")}${block("butter", "15:30", "Ship release", "Team · 30 min")}</div>
            <div class="toast" id="toast">${icon("check")}Added to Friday</div>${dock()}${phoneChrome()}`;
          fillIcons(phone);
          phone.dataset.ready = "1";
        }
        const text = typed(TEXT, t, 400, 14);
        const n = text.length;
        const token = (from, to, cls) => {
          const part = text.slice(from, Math.min(n, to));
          if (!part) return "";
          return n >= to ? `<span class="tok ${cls} on">${part}</span>` : part;
        };
        $("typed").innerHTML = `${text.slice(0, 11)}${token(11, 13, "tk-who")}${text.slice(13, 14)}${token(14, 17, "tk-day")}${text.slice(17, 18)}${token(18, 23, "tk-time")}`;
        const sent = t >= 3600;
        $("ph").style.display = n ? "none" : "inline";
        $("caret").style.opacity = !sent && caretOn(t, 2100) ? "1" : "0";
        if (sent) $("typed").textContent = "";
        if (sent) $("ph").style.display = "inline";
        const pv = $("preview");
        const up = ease.outQuint(seg(t, 2250, 520));
        const away = ease.inOut(seg(t, 3600, 420));
        pv.style.opacity = String(Math.min(1, up * 1.4) * (1 - away));
        pv.style.transform = `translateY(${(1 - up) * -10 + away * 10}px) scale(${1 - 0.06 * away})`;
        const room = 94 * (up - ease.inOut(seg(t, 3880, 520)));
        $("label").style.top = `${316 + room}px`;
        $("blocks").style.top = `${346 + room}px`;
        $("addb").style.transform = `scale(${press(t, 3450)})`;
        const toast = $("toast");
        const q = ease.outQuint(seg(t, 3750, 480));
        toast.style.opacity = String(q);
        toast.style.transform = `translate(-50%, ${(1 - q) * 16}px)`;
        phone.querySelectorAll(".day")[4].querySelector("i").style.transform = `scale(${ease.outBack(seg(t, 3750, 420))})`;
      }

      function reschedule(t) {
        if (!phone.dataset.ready) {
          phone.innerHTML = `${head("Tue 12 May", "Today")}${week()}
            <div class="abs card banner" id="banner"><div class="why">${icon("clock")}Design review is running over</div><h3>Moved 2 plans to fit</h3>
              <div class="move">${icon("target")}Focus time<span class="t">13:00 ${ARROW} <b>13:30</b></span></div><div class="move">${icon("users")}Call with Sam<span class="t">16:30 ${ARROW} <b>17:00</b></span></div>
              <div class="acts"><div class="btn" id="keep">Keep</div><div class="btn ghost">Undo</div></div></div>
            <div class="label" id="label"><span>Schedule</span><span class="count">3 plans</span></div>
            <div class="blocks" id="blocks">${block("lilac", "10:30", "Design review", "Studio · running 30 min over")}${block("mint", "13:00", "Focus time", "Write the brief · 90 min", "b2")}${block("peach", "16:30", "Call with Sam", "Phone · 30 min", "b4")}</div>
            ${dock()}${phoneChrome()}`;
          fillIcons(phone);
          phone.dataset.ready = "1";
        }
        const open = ease.outQuint(seg(t, 700, 560));
        const close = ease.inOut(seg(t, 3500, 520));
        const h = 228 * open * (1 - close);
        const banner = $("banner");
        banner.style.height = `${h}px`;
        banner.style.opacity = String(Math.min(1, open * 1.6) * (1 - close));
        banner.style.padding = h < 30 ? "0 16px" : "";
        const push = h + 19 * Math.min(1, h / 60);
        $("label").style.top = `${226 + push}px`;
        $("blocks").style.top = `${256 + push}px`;
        $("keep").style.transform = `scale(${press(t, 3350)})`;
        for (const [id, from, to] of [
          ["b2", "13:00", "13:30"],
          ["b4", "16:30", "17:00"],
        ]) {
          const el = $(id);
          const at = id === "b2" ? 1500 : 1800;
          const p = seg(t, at, 300);
          const time = el.querySelector(".time");
          time.innerHTML = p < 0.5 ? from : `${to}<span class="movedchip">Moved</span>`;
          time.style.opacity = String(ease.inOut(Math.abs(1 - 2 * p)) * 0.85 + 0.15);
          el.style.boxShadow = p > 0 ? `0 0 0 ${2 * Math.sin(Math.PI * Math.min(1, p))}px var(--coral) inset` : "";
        }
      }

      function share(t) {
        const ITEMS = ["Book the cabin", "Pack the tent", "Grab snacks", "Fill the car", "Charge the speaker", "Check the weather"];
        if (!phone.dataset.ready) {
          phone.innerHTML = `${head("List · 6 items", "Weekend away")}
            <div class="abs hero" id="hero"><small>Sat 16 to Sun 17 May</small><b>Two nights at the coast</b><div class="who" id="who"><span id="whoText">Just you</span></div><div class="shareb" id="shareb">${icon("share")}</div></div>
            <div class="abs card items" id="items">${ITEMS.map((s, i) => `<div class="item${i === 0 ? " done" : ""}"><div class="check${i === 0 ? " on" : ""}">${TICK}</div><span>${s}</span></div>`).join("")}</div>
            <div class="scrim" id="scrim"></div>
            <div class="sheet2" id="sheet"><div class="grabber"></div><h2 class="display">Share ‘Weekend away’</h2>
              <div class="people" id="people"><div class="person"><div class="avatar a1">S</div>Sam</div><div class="person"><div class="avatar a3">J</div>Jo</div><div class="person"><div class="avatar a4">P</div>Priya</div><div class="person invite"><div class="avatar">${icon("plus")}</div>Add</div></div>
              <div class="linkrow">${icon("link")}Anyone with the link can view</div><div class="big" id="go">Share with 3 people</div></div>
            <div class="toast" id="toast">${icon("check")}Shared with 3 people</div>${dock("Lists")}${phoneChrome()}`;
          fillIcons(phone);
          phone.dataset.ready = "1";
        }
        $("shareb").style.transform = `scale(${press(t, 900)})`;
        $("shareb").style.background = t >= 900 && t < 1150 ? "rgba(255,255,255,0.4)" : "";
        const up = ease.outQuint(seg(t, 1000, 520));
        const down = ease.inOut(seg(t, 2450, 420));
        const vis = up * (1 - down);
        $("scrim").style.opacity = String(0.42 * vis);
        $("sheet").style.transform = `translateY(${(1 - vis) * 110}%)`;
        $("go").style.transform = `scale(${press(t, 2300)})`;
        const shared = t >= 2800;
        $("whoText").textContent = shared ? "Sam, Jo and Priya" : "Just you";
        const who = $("who");
        if (shared && !who.querySelector(".avatars")) {
          who.insertAdjacentHTML("afterbegin", '<div class="avatars"><div class="avatar a1">S</div><div class="avatar a3">J</div><div class="avatar a4">P</div></div>');
        }
        if (!shared) who.querySelector(".avatars")?.remove();
        const av = who.querySelector(".avatars");
        if (av) pop(av, t, 2800);
        const toast = $("toast");
        const q = ease.outQuint(seg(t, 2950, 480));
        toast.style.opacity = String(q * (1 - ease.inOut(seg(t, 4700, 400))));
        toast.style.transform = `translate(-50%, ${(1 - q) * 16}px)`;
        for (const [i, at, who2, cls] of [
          [1, 3700, "S", "a1"],
          [2, 4250, "J", "a3"],
        ]) {
          const item = phone.querySelectorAll(".item")[i];
          const on = t >= at;
          item.classList.toggle("done", on);
          tick(item.querySelector(".check"), t, at);
          let by = item.querySelector(".by");
          if (on && !by) {
            item.insertAdjacentHTML("beforeend", `<div class="avatar by ${cls}">${who2}</div>`);
            by = item.querySelector(".by");
          }
          if (!on) by?.remove();
          if (by) pop(by, t, at + 80);
        }
      }

      function focusflow(t) {
        if (!phone.dataset.ready) {
          phone.innerHTML = `${head("Tue 12 May", "Today")}${week()}
            <div class="abs card fcard" id="fcard"><div class="row1"><div class="badge">${icon("target")}</div><div class="txt"><b>Focus</b><span>Quiet the rest of the day</span></div><div class="bigtoggle" id="toggle"><div class="knob"></div></div></div>
              <div class="timer" id="timer"><div><div class="clock tnum" id="clock">25:00</div><small>Until 14:30 · Write the brief</small></div><div class="chip">${icon("bellOff")}Paused</div></div></div>
            <div class="abs dimmed" id="dimmed"><div class="label" style="position:relative;left:0;right:0;margin:0 8px 12px"><span>Schedule</span><span class="count">3 plans</span></div><div style="display:flex;flex-direction:column;gap:10px">${block("lilac", "10:30", "Design review", "Studio · 45 min")}${block("butter", "15:30", "Ship release", "Team · 30 min")}</div></div>
            ${dock()}${phoneChrome()}`;
          fillIcons(phone);
          phone.dataset.ready = "1";
        }
        const k = ease.outBack(seg(t, 1500, 320));
        $("toggle").querySelector(".knob").style.transform = `translateX(${28 * k}px)`;
        $("toggle").style.background = mix(dark ? "#4a453f" : "#d9d5cd", dark ? "#86ad72" : "#6f9f68", ease.out(seg(t, 1500, 260)));
        const grow = ease.inOut(seg(t, 1850, 650));
        $("fcard").style.height = `${108 + 112 * grow}px`;
        $("timer").style.opacity = String(ease.out(seg(t, 2150, 420)));
        $("dimmed").style.opacity = String(1 - 0.6 * ease.inOut(seg(t, 1900, 600)));
        $("dimmed").style.top = `${414 + 112 * grow}px`;
        const secs = 25 * 60 - Math.max(0, Math.floor((t - 2900) / 1000));
        $("clock").textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
      }

      function insights() {
        const H = [3.2, 2.1, 4.0, 2.8, 1.6, 0.4, 0];
        phone.innerHTML = `${head("11 to 17 May", "Insights")}
          <div class="abs card insight"><small>Focus this week</small><b>9.5 h</b><em>${icon("arrowUp")}2 h more than last week</em>
            <svg class="ring" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="var(--track)" stroke-width="12"/><circle cx="52" cy="52" r="44" fill="none" stroke="var(--sage)" stroke-width="12" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="69" transform="rotate(-90 52 52)"/><text x="52" y="58" text-anchor="middle" font-family="Inter Tight" font-weight="700" font-size="22" fill="currentColor">76%</text></svg></div>
          <div class="abs card bars"><small>Focus hours by day</small><div class="chart">${DAYS.map(([d], i) => `<div class="${i === 1 ? "now" : ""}"><i style="height:${Math.max(8, H[i] * 29)}px"></i>${d.slice(0, 1)}</div>`).join("")}</div></div>
          <div class="abs minis"><div class="card mini"><small>Plans done</small><b class="tnum">18 / 22</b><div class="track"><i style="width:82%;background:var(--coral)"></i></div></div><div class="card mini"><small>Meetings</small><b class="tnum">6 h</b><div class="track"><i style="width:38%;background:var(--sky)"></i></div></div></div>
          ${dock("Insights")}${phoneChrome()}`;
        fillIcons(phone);
      }

      function month() {
        const EV = { 4: ["sky"], 6: ["mint", "lilac"], 7: ["peach"], 11: ["sky", "peach", "lilac"], 12: ["sky", "lilac", "mint"], 13: ["peach", "mint"], 14: ["mint", "lilac"], 15: ["butter", "mint"], 19: ["sky"], 20: ["mint"], 21: ["lilac", "mint"], 22: ["butter"], 26: ["sky", "mint"], 27: ["peach"], 28: ["mint"], 29: ["butter"] };
        const colour = { sky: "var(--sky)", mint: "var(--mint)", lilac: "var(--lilac)", peach: "var(--peach)", butter: "var(--butter)" };
        const cells = [];
        for (let i = 0; i < 35; i++) {
          const d = i - 3;
          const label = d < 1 ? 27 + i + 1 : d > 31 ? d - 31 : d;
          const out = d < 1 || d > 31;
          const span = d === 16 ? '<div class="span a"></div>' : d === 17 ? '<div class="span b"></div>' : "";
          const dots = !out && EV[d] ? `<div class="dots">${EV[d].map((c) => `<i style="background:${colour[c]}"></i>`).join("")}</div>` : "";
          cells.push(`<div class="d${out ? " out" : ""}${d === 12 ? " today" : ""}">${span}<span class="tnum">${label}</span>${dots}</div>`);
        }
        phone.innerHTML = `${head("Calendar", "May")}
          <div class="abs card month"><div class="mgrid">${["M", "T", "W", "T", "F", "S", "S"].map((h) => `<div class="h">${h}</div>`).join("")}${cells.join("")}</div></div>
          <div class="abs card upnext"><div class="up"><i style="background:var(--lilac)"></i><div><b>Design review</b><span>Today · 10:30</span></div></div><div class="up"><i style="background:var(--peach)"></i><div><b>Weekend away</b><span>Sat 16 to Sun 17 May</span></div></div><div class="up"><i style="background:var(--butter)"></i><div><b>Retro</b><span>Fri 15 May · 10:00</span></div></div></div>
          ${dock()}${phoneChrome()}`;
        fillIcons(phone);
      }

      const SCENES = { sorted, quickadd, reschedule, share, focusflow, insights, month };
      window.render = (t) => SCENES[scene](t);
      window.pageReady = ready();
    </script>
  </body>
</html>
