name: Audit

# Advisory and policy scanning of the RESIDENT dependency graph. dependency-review.yml inspects a pull request's diff and Dependabot waits out a seven-day cooldown, so neither notices a RUSTSEC or npm advisory published against a crate or package already in the lock files; this job does, on every pull request and once a week. The crate graph is also held to src-tauri/deny.toml: its licence allow list, no wildcard versions (duplicates only warn), crates.io as the only source.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      # No install: pnpm audit reads the lock file, so no package script runs here. What ships in the app
      # (the production tree) fails on a moderate advisory; the dev tree never reaches a user's Mac, so it
      # fails on high only.
      - name: pnpm audit (shipped packages, moderate)
        run: pnpm audit --prod --audit-level moderate

      - name: pnpm audit (dev tree, high)
        run: pnpm audit --audit-level high

      # cargo deny reads Cargo.lock against the RustSec advisory database (the same one cargo audit uses),
      # then holds the graph to deny.toml's licence, bans and sources policy.
      - name: cargo deny check advisories licenses bans sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
          manifest-path: src-tauri/Cargo.toml
          rust-version: stable
