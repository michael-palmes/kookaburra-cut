name: T7 signers

# Runs the base branch's copy of this file (pull_request_target), so a pull request cannot edit the
# check away. The pull request's commits are fetched as data only and never executed.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  signed-head:
    name: Head commit signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request head as data
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
          [ "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA" ] || { echo "::error::the fetched head is not the event's head"; exit 1; }

      # The head commit's signature covers the whole tree, so one check guards every path. A change to
      # either signer list needs the tag key, so a stolen commit key cannot add a key of its own. Head
      # against base catches every change a merge could make; git diff erroring also lands on the tag key.
      - name: Require an allowed signature on the head commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          signers=allowed_signers
          fix="git commit --amend --no-edit -S with that key, then push (for Dependabot, check out its branch, re-sign the head the same way and push)"
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- .github/allowed_signers .github/allowed_tag_signers; then
            signers=allowed_tag_signers
            fix="git -c user.signingkey=\"\$(git config --path kookaburra.tagkey)\" commit --amend --no-edit -S, then push (if this pull request does not change a signer list, bring it up to date with its base branch)"
            echo "A signer list differs from the base branch, so the head must carry the tag key"
          fi
          git show "${BASE_SHA}:.github/${signers}" > "$RUNNER_TEMP/signers"
          if git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/signers" -c gpg.minTrustLevel=fully verify-commit --verbose "$HEAD_SHA"; then
            echo "The head commit is signed by a key in ${signers}"
          else
            echo "::error::the head commit must be signed by a key in the base branch's .github/${signers}. Fix: ${fix}"
            exit 1
          fi
