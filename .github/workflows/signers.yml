name: Signers

# Runs the default branch's copy of this file (pull_request_target), so a pull request cannot edit
# the check away. The pull request's commits are fetched as data only and never executed.
on:
  pull_request_target:
    # edited covers a retarget: a pass against one base must not carry to another.
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  signed-head:
    name: Head commit signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request head as data
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A just-opened pull request can fire this before GitHub has created its ref.
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head" && break
            [ "$attempt" -lt 5 ] || { echo "::error::refs/pull/${PR}/head never appeared"; exit 1; }
            sleep 5
          done
          [ "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA" ] || { echo "::error::the fetched head is not the event's head"; exit 1; }

      # The head's signature covers the whole tree; a change to what the release pipeline runs or pins needs the tag key, so a stolen commit key can't add a key, point a release at the commit list or swap what the sign job runs.
      - name: Require an allowed signature on the head commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tag_paths=(
            .cargo
            .github
            .npmrc
            package.json
            patches
            pnpm-lock.yaml
            pnpm-workspace.yaml
            rust-toolchain
            rust-toolchain.toml
            scripts/build-ffmpeg-sidecar.sh
            scripts/bundle-digest.sh
            scripts/check-licensed-models.sh
            scripts/install-build-tools.sh
            scripts/make-dmg.sh
            scripts/release.sh
            scripts/seed-cargo-target.sh
            scripts/setup-models.sh
            scripts/sidecar-digest.sh
            scripts/sign-and-notarize.sh
            scripts/tauri-path
            scripts/verify-release.sh
            scripts/verify-updater-sig.mjs
            src-tauri/.cargo
            src-tauri/Cargo.lock
            src-tauri/rust-toolchain
            src-tauri/rust-toolchain.toml
            src-tauri/tauri.conf.json
            src/assets/models/licensed.sha256
          )
          signers=allowed_signers
          fix="git commit --amend --no-edit -S with that key, then push (for Dependabot, check out its branch, re-sign the head the same way and push)"
          changed=false
          bases="$(git merge-base --all "$BASE_SHA" "$HEAD_SHA")" || changed=true
          for merge_base in $bases; do
            git diff --quiet "$merge_base" "$HEAD_SHA" -- "${tag_paths[@]}" || changed=true
          done
          if [ "$changed" = true ]; then
            signers=allowed_tag_signers
            fix="git -c user.signingkey=\"\$(git config --path kookaburra.tagkey)\" commit --amend --no-edit -S, then push (for Dependabot, check out its branch first)"
            echo "This pull request changes what the release pipeline runs or pins, so the head must carry the tag key"
          fi
          git show "${BASE_SHA}:.github/${signers}" > "$RUNNER_TEMP/signers"
          if git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/signers" -c gpg.minTrustLevel=fully verify-commit --verbose "$HEAD_SHA"; then
            echo "The head commit is signed by a key in ${signers}"
          else
            echo "::error::the head commit must be signed by a key in the base branch's .github/${signers}. Fix: ${fix}"
            exit 1
          fi
