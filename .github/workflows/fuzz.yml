name: Fuzz

# libFuzzer over the untrusted-input parsers (src-tauri/fuzz): weekly, on demand, and on a PR that touches the harness.
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/fuzz/**"
      - "src-tauri/src/fuzz_api.rs"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context!() reads frontendDist (../dist) at compile time, so build the frontend first.
      - name: Build frontend
        run: pnpm build

      # cargo-fuzz needs nightly's coverage flags; rust-toolchain.toml pins stable for everything else.
      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri/fuzz -> target"

      # tauri-build validates externalBin paths; the real sidecars are gitignored and nothing fuzzed runs them.
      - name: Stub ffmpeg sidecars
        run: |
          triple="$(rustc +nightly -vV | sed -n 's/host: //p')"
          mkdir -p src-tauri/bin
          for bin in ffmpeg ffprobe; do
            printf '#!/bin/sh\nexit 0\n' > "src-tauri/bin/${bin}-${triple}"
            chmod +x "src-tauri/bin/${bin}-${triple}"
          done

      # tauri-build also validates bundle.resources; the beat-this model is gitignored (pnpm setup:models).
      - name: Stub the beat-this model
        run: bash scripts/setup-models.sh --stub

      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz@0.13.2

      # The RUSTFLAGS let rten's unused cdylib link under sancov (src-tauri/fuzz/README.md says why).
      - name: Build the targets
        working-directory: src-tauri
        env:
          RUSTFLAGS: -Clink-arg=-Wl,-undefined,dynamic_lookup
        run: cargo +nightly fuzz build -s none

      # Each target runs a minute from its seeds; every target runs even after a crash, which fails the job with its input under fuzz/artifacts.
      - name: Fuzz
        working-directory: src-tauri
        env:
          RUSTFLAGS: -Clink-arg=-Wl,-undefined,dynamic_lookup
        run: |
          crashed=""
          for target in $(cargo +nightly fuzz list); do
            mkdir -p "fuzz/corpus/$target"
            cargo +nightly fuzz run -s none "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" -- \
              -max_total_time=60 -rss_limit_mb=2048 -max_len=65536 || crashed="$crashed $target"
          done
          if [ -n "$crashed" ]; then
            echo "::error::fuzz targets crashed:$crashed"
            exit 1
          fi

      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: src-tauri/fuzz/artifacts
          if-no-files-found: ignore
