name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Scopes the rust job and kb suite by path; pushes, and a failed scope (empty flags), run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      kit: ${{ steps.scope.outputs.kit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: bash scripts/ci-scope.sh "$EVENT" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck and build
        run: pnpm build

      - name: Unit tests
        run: pnpm vitest run

      - name: Script tests
        run: node --test scripts/*.test.mjs

      # No workspace on a runner, so only the denylist half runs (scripts/workspace-denylist.txt).
      - name: Workspace names
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          node scripts/workspace-names.mjs --base "$BASE"

      # Mostly waiting on fake apps and retries, so modules run well past the core count.
      - name: kb tests
        if: ${{ needs.changes.outputs.kit != 'false' }}
        run: node scripts/test-kit.mjs --jobs 8

  rust:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context!() reads frontendDist (../dist) at compile time, so build the frontend first.
      - name: Build frontend
        run: pnpm build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"

      # tauri-build validates externalBin paths; the real sidecars are gitignored and the tests that run them are #[ignore]d.
      - name: Stub ffmpeg sidecars
        run: |
          triple="$(rustc -vV | sed -n 's/host: //p')"
          mkdir -p src-tauri/bin
          for bin in ffmpeg ffprobe; do
            printf '#!/bin/sh\nexit 0\n' > "src-tauri/bin/${bin}-${triple}"
            chmod +x "src-tauri/bin/${bin}-${triple}"
          done

      # tauri-build also validates bundle.resources; the beat-this model is gitignored (pnpm setup:models) and no test loads it.
      - name: Stub the beat-this model
        run: bash scripts/setup-models.sh --stub

      # clippy runs the full check, so a separate cargo check would only repeat it.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
