name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Scopes the rust job and kb suite by path; pushes, and a failed scope (empty flags), run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      kit: ${{ steps.scope.outputs.kit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: bash scripts/ci-scope.sh "$EVENT" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: ${{ !cancelled() }}
    # setup-python has no 3.9 for a newer image, and the kit check below needs it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck and build
        run: pnpm build

      - name: Unit tests
        run: pnpm vitest run

      - name: Script tests
        run: node --test scripts/*.test.mjs

      # No workspace on a runner, so only the denylist half runs (scripts/workspace-denylist.txt).
      - name: Workspace names
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          node scripts/workspace-names.mjs --base "$BASE"

      - name: Set up the Python stock macOS ships
        id: python39
        if: ${{ needs.changes.outputs.kit != 'false' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
          update-environment: false

      - name: Kit Python compiles on 3.9
        if: ${{ needs.changes.outputs.kit != 'false' }}
        env:
          PYTHON39: ${{ steps.python39.outputs.python-path }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache39
        run: '"$PYTHON39" -m compileall -q .agents/skills'

      # Mostly waiting on fake apps and retries, so modules run well past the core count.
      - name: kb tests
        if: ${{ needs.changes.outputs.kit != 'false' }}
        run: node scripts/test-kit.mjs --jobs 8

  rust:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context!() reads frontendDist (../dist) at compile time, so build the frontend first.
      - name: Build frontend
        run: pnpm build

      # rust-toolchain.toml pins the version.
      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"

      # tauri-build validates externalBin paths; the real sidecars are gitignored and the tests that run them are #[ignore]d.
      - name: Stub ffmpeg sidecars
        run: |
          triple="$(rustc -vV | sed -n 's/host: //p')"
          mkdir -p src-tauri/bin
          for bin in ffmpeg ffprobe; do
            printf '#!/bin/sh\nexit 0\n' > "src-tauri/bin/${bin}-${triple}"
            chmod +x "src-tauri/bin/${bin}-${triple}"
          done

      # tauri-build also validates bundle.resources; the beat-this model is gitignored (pnpm setup:models) and no test loads it.
      - name: Stub the beat-this model
        run: bash scripts/setup-models.sh --stub

      # clippy runs the full check, so a separate cargo check would only repeat it.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --features fuzzing -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --features fuzzing

      # The fuzz harness on stable: every target body runs over its seeds, so it cannot rot between fuzz.yml's nightly runs.
      - name: Fuzz harness smoke
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: target
        run: |
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path fuzz/Cargo.toml
