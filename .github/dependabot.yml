version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      # three is 0.x, so each release shifts lit pixels (a baseline rebase); postprocessing caps its range.
      three-family:
        applies-to: version-updates
        patterns: ["three", "@types/three", "postprocessing"]
        update-types: ["minor", "patch"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # Tauri minors move by hand in one PR with the cargo side: `tauri build` refuses mismatched minors.
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
    # Tauri minors move by hand in one PR with the npm side; wry is 0.x and follows tauri-runtime-wry.
    ignore:
      - dependency-name: "tauri"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tauri-*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "wry"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
