version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      # three is 0.x, so each release shifts lit pixels (a baseline rebase); postprocessing caps its range.
      three-family:
        applies-to: version-updates
        patterns: ["three", "@types/three", "postprocessing"]
        update-types: ["minor", "patch"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # Cargo.toml's wry pin holds Rust tauri at 2.11, and `tauri build` needs npm on the same minor.
    ignore:
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@tauri-apps/plugin-*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
