[package]
name = "kookaburra-cut"
version = "0.19.0"
description = "AI driven deterministic animated-video studio"
authors = ["Michael Palmes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/michael-palmes/kookaburra-cut"
homepage = "https://kookaburracut.com/"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kookaburra_cut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# protocol-asset: workspace/caches load in the webview as asset: URLs (v9 · M2).
tauri = { version = "=2.12.3", features = ["protocol-asset", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
trash = "5"
tokio = { version = "1", features = ["full"] }
sha2 = "0.11"
portable-pty = "0.9"
# v10 · M6: static-instances variable fonts at pin time (fonts.rs). Exact-pinned —
# instancer output bytes participate in export baselines (rebase discipline).
allsorts = "=0.17.0"
libc = "0.2"
# v13: .kbpack export/import. `zip` and `walkdir` already ride in the lock file
# via tauri-plugin-updater and tauri-build, so these add no graph weight.
zip = "4"
walkdir = "2"
ed25519-dalek = "3"
getrandom = "0.4"
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Naming the type of `RunEvent::Opened { urls }` (Open With); already in the lock via tauri.
url = "2"
png = "=0.18.1"
# Song analysis: beat and downbeat tracking with the bundled beat-this small model (pure-Rust rten runtime; we decode with the ffmpeg sidecar, so no symphonia).
beat-this = { version = "=1.1.0", default-features = false }

# macOS-only: reach the real NSMenuItem to set a true SF Symbol on the Settings
# menu entry (Tauri/muda's NativeIcon can't reference systemSymbolName images).
# Versions match the ones already in tauri's own dependency tree.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-text = "22.0.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSResponder",
  "NSMenu",
  "NSMenuItem",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSColor",
  "NSColorSampler",
  "NSColorSpace",
  "block2",
  # Declared here rather than inherited from wry: it gates NSColor's component accessors.
  "objc2-core-foundation",
] }
objc2-foundation = "0.3"
objc2-web-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-app-kit",
  "block2",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKPreferences",
  "WKSnapshotConfiguration",
  "WKWebsiteDataRecord",
  "WKWebsiteDataStore",
] }
block2 = "0.6"
# Ingest conform (conform_av.rs): AVFoundation decodes in-process, so no second binary to sign; the 0.3.2 family the AppKit bindings already lock.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "AVAsset",
  "AVAssetReader",
  "AVAssetReaderOutput",
  "AVAssetTrack",
  "AVAssetTrackSegment",
  "AVMediaFormat",
  "AVVideoSettings",
  "objc2-core-foundation",
  "objc2-core-media",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFCGTypes",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
  "std",
  "CMBase",
  "CMFormatDescription",
  "CMSampleBuffer",
  "CMTime",
  "CMTimeRange",
  "objc2-core-video",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }
# Never imported: pins the webview layer to tauri-runtime-wry's wry, so move it with tauri (one wry in the lock).
wry = "=0.57.0"

# Inference at opt-level 0 is far too slow for the dev app and tests, so dev builds optimise the beat-this stack.
[profile.dev.package.beat-this]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3

# macOS 27 dyld rejects optimised proc-macro dylibs (mis-aligned LINKEDIT string pool); opt-level 0 here covers only build scripts and proc macros, the shipped binary is unaffected.
[profile.release.build-override]
opt-level = 0
debug = true

# Unpacked debug info (the macOS default) leaves a new set of object files in target/debug/deps on every incremental rebuild of this crate (about 0.2 GB each).
[profile.dev.package.kookaburra-cut]
split-debuginfo = "off"
