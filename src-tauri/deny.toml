# cargo deny, run by the Audit workflow on every pull request and weekly: advisories against the
# RustSec database, licences against the allow list below, duplicate and wildcard versions, and
# the source of every crate. The GPL ffmpeg sidecar is a separate process, not a crate, so it is
# not in this graph (NOTICE.md). The app ships for one target, so the graph is that target's:
# Windows-only and Linux-only crates (the updater's zip, the GTK stack) never compile into the binary.
[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# The default reports an unsound crate only when the app depends on it directly.
unsound = "all"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "0BSD",
  "CC0-1.0",
  "MIT-0",
  "Unlicense",
]
confidence-threshold = 0.8
# The fuzz harness (fuzz/Cargo.toml, never shipped) links libFuzzer, under the permissive NCSA licence.
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys" }]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# No HTTP client of the app's own (SECURITY.md, "What leaves the Mac"): the updater plugin is the one way in.
deny = [
  { crate = "reqwest", wrappers = ["tauri-plugin-updater"], reason = "only the updater fetches over HTTP" },
  { crate = "hyper-rustls", wrappers = ["reqwest"], reason = "reqwest's TLS connector only" },
  { crate = "hyper-util", wrappers = ["reqwest", "hyper-rustls"], reason = "reqwest's client only" },
  { crate = "hyper", wrappers = ["reqwest", "hyper-util", "hyper-rustls"], reason = "reqwest's client only" },
  { crate = "ureq", reason = "no HTTP client of the app's own" },
  { crate = "isahc", reason = "no HTTP client of the app's own" },
  { crate = "curl", reason = "no HTTP client of the app's own" },
  { crate = "attohttpc", reason = "no HTTP client of the app's own" },
  { crate = "minreq", reason = "no HTTP client of the app's own" },
  { crate = "surf", reason = "no HTTP client of the app's own" },
  { crate = "awc", reason = "no HTTP client of the app's own" },
  { crate = "http-req", reason = "no HTTP client of the app's own" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
