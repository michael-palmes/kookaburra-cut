# cargo deny: advisories only (the Audit workflow). Licences and sources are reviewed by hand.
# The app ships for one target, so the graph is that target's: Windows-only and Linux-only
# crates (the updater's zip, the GTK stack) never compile into the binary.
[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []
